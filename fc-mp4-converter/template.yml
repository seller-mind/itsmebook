ROSTemplateFormatVersion: '2015-09-01'
Transform: 'Aliyun::Serverless-2018-04-03'
Resources:
  itsmebook-mp4-converter:
    Type: 'Aliyun::Serverless::Service'
    Properties:
      Description: '是我呀绘本 - WebM转MP4视频转换'
      LogConfig:
        Project: itsmebook-logs
        Logstore: fc-logs
      NasConfig: Auto

    mp4-convert:
      Type: 'Aliyun::Serverless::Function'
      Properties:
        Handler: index.handler
        Runtime: nodejs18
        CodeUri: ./
        Timeout: 120
        MemorySize: 512
        EnvironmentVariables:
          FFMPEG_PATH: /opt/bin/ffmpeg
        Layers:
          - acs:fc:{region}:official:layers/ffmpeg/versions/1

      Events:
        http-trigger:
          Type: HTTP
          Properties:
            AuthType: none
            Methods:
              - POST
              - OPTIONS
